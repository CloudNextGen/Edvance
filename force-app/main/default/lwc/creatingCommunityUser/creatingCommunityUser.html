<template>
    <section class="user-form slds-card" aria-label="Create community user">
        <header class="user-form__header">
            <div class="user-form__icon">
                <lightning-icon icon-name="standard:user" size="small" alternative-text="User"></lightning-icon>
            </div>
            <div>
                <p class="user-form__eyebrow">USER MANAGEMENT</p>
                <h1 class="user-form__title">Create User</h1>
                <p class="user-form__subtitle">Enter the details below to create a portal user.</p>
            </div>
        </header>

        <div class="user-form__body">
            <div class="user-form__grid">
                <lightning-input
                    label="First Name"
                    value={firstName}
                    onchange={handleChange}
                    data-field="firstName"
                    required>
                </lightning-input>

                <lightning-input
                    label="Last Name"
                    value={lastName}
                    onchange={handleChange}
                    data-field="lastName"
                    required>
                </lightning-input>

                <lightning-input
                    type="email"
                    label="Email"
                    value={email}
                    onchange={handleChange}
                    data-field="email"
                    required>
                </lightning-input>

                <lightning-input
                    type="tel"
                    label="Phone"
                    value={phone}
                    onchange={handleChange}
                    data-field="phone">
                </lightning-input>

                <lightning-record-picker
                    label="Account"
                    placeholder="Search Accounts..."
                    object-api-name="Account"
                    value={selectedAccountId}
                    onchange={handleAccountChange}
                    required>
                </lightning-record-picker>

                <lightning-combobox
                    label="User Type"
                    value={userType}
                    options={userTypeOptions}
                    onchange={handleUserTypeChange}
                    placeholder="Select User Type"
                    required>
                </lightning-combobox>

                <lightning-record-picker
                    label="HR"
                    placeholder="Search HR Users..."
                    object-api-name="User"
                    value={selectedHrId}
                    onchange={handleHrChange}
                    data-field="hrPicker">
                </lightning-record-picker>

                <lightning-record-picker
                    label="Manager"
                    placeholder="Search Managers..."
                    object-api-name="User"
                    value={selectedManagerId}
                    onchange={handleManagerChange}
                    data-field="managerPicker">
                </lightning-record-picker>

                <lightning-record-picker
                    label="Mentor"
                    placeholder="Search Mentors..."
                    object-api-name="User"
                    value={selectedMentorId}
                    onchange={handleMentorChange}
                    data-field="mentorPicker">
                </lightning-record-picker>
            </div>

            <template if:true={message}>
                <div class={messageClass} role="status">
                    <p>{message}</p>
                </div>
            </template>

            <footer class="user-form__footer">
                <lightning-button
                    variant="brand"
                    label="Create User"
                    onclick={handleSubmit}
                    disabled={isLoading}>
                </lightning-button>
            </footer>

            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Creating user..."
                    size="small">
                </lightning-spinner>
            </template>
        </div>
    </section>
</template>
