<template>
    <div class="requests-widget">
        <template if:true={isLoading}>
            <div class="loading-wrap">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="header-row">
                <div>
                    <p class="eyebrow">Support</p>
                    <h2 class="heading">My Requests</h2>
                </div>
                <div class="header-actions">
                    <button class="secondary-btn refresh-btn" onclick={handleRefresh} disabled={isRefreshing}
                        aria-label="Refresh requests" title="Refresh requests">
                        <template if:true={isRefreshing}>
                            <span class="refresh-spinner" aria-hidden="true"></span>
                        </template>
                        <template if:false={isRefreshing}>
                            <span class="refresh-icon" aria-hidden="true">↻</span>
                        </template>
                    </button>
                    <div class="stats-wrap" role="group" aria-label="Filter requests by status">
                        <button class={allFilterClass} onclick={handleFilterChange} data-filter="ALL">
                            All ({totalCount})
                        </button>
                        <button class={openFilterClass} onclick={handleFilterChange} data-filter="New">
                            {openCount} Open
                        </button>
                        <button class={progressFilterClass} onclick={handleFilterChange} data-filter="Working">
                            {progressCount} In Progress
                        </button>
                        <button class={completedFilterClass} onclick={handleFilterChange} data-filter="Closed">
                            {completedCount} Completed
                        </button>
                    </div>
                </div>
            </div>

            <template if:true={hasError}>
                <div class="alert alert_error">{errorMessage}</div>
            </template>

            <template if:true={hasRequests}>
                <div class="record-list">
                    <template for:each={displayRequests} for:item="req">
                        <div key={req.id} class={req.rowClass}>
                            <div class="request-row__main" data-id={req.id} onclick={handleRowToggle}>
                                <div class="request-row__left">
                                    <p class="request-subject">{req.subject}</p>
                                    <p class="request-date">Raised {req.date}</p>
                                </div>
                                <div class="request-row__right">
                                    <span class={req.badgeClass}>{req.statusLabel}</span>
                                    <svg class={req.chevronClass} viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
                                        <path d="M5 7l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </div>
                            <template if:true={req.isExpanded}>
                                <div class="request-row__detail">
                                    <p class="request-detail-label">Description</p>
                                    <p class="request-detail-text">{req.description}</p>
                                    <c-case-comment-thread record-id={req.id} show-submit-button="true"></c-case-comment-thread>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={noRequests}>
                <p class="empty-text">{noRequestsMessage}</p>
            </template>

            <div class="new-request-actions">
                <button class="primary-btn" onclick={handleOpenModal}>
                    <span aria-hidden="true">+</span> New Request
                </button>
            </div>
        </template>

        <template if:true={isModalOpen}>
            <div class="modal-backdrop" onclick={handleCloseModal}>
                <div class="modal-card" onclick={handleModalContentClick} role="dialog" aria-modal="true" aria-labelledby="new-request-title">
                    <div class="modal-header">
                        <h3 class="modal-title" id="new-request-title">New Request</h3>
                        <button class="modal-close-btn" onclick={handleCloseModal} aria-label="Close" disabled={isSubmitting}>&times;</button>
                    </div>

                    <div class="modal-body">
                        <template if:true={hasFormError}>
                            <div class="alert alert_error">{formError}</div>
                        </template>

                        <lightning-combobox
                            label="Request Type"
                            placeholder="Select a request type"
                            value={formRequestType}
                            options={requestTypeOptions}
                            onchange={handleTypeChange}
                            disabled={isSubmitting}
                            required
                            message-when-value-missing="Please select a request type."
                        ></lightning-combobox>

                        <lightning-input
                            label="Subject"
                            value={formSubject}
                            onchange={handleSubjectChange}
                            disabled={isSubmitting}
                            class="modal-field"
                            required
                            message-when-value-missing="Please enter a subject."
                        ></lightning-input>

                        <lightning-textarea
                            label="Description"
                            value={formDescription}
                            onchange={handleDescriptionChange}
                            disabled={isSubmitting}
                            class="modal-field"
                            required
                            message-when-value-missing="Please enter a description."
                        ></lightning-textarea>
                    </div>

                    <div class="modal-footer">
                        <button class="secondary-btn" onclick={handleCloseModal} disabled={isSubmitting}>Cancel</button>
                        <button class="primary-btn" onclick={handleSubmit} disabled={isSubmitDisabled}>
                            <template if:false={isSubmitting}>Submit</template>
                            <template if:true={isSubmitting}>Submitting...</template>
                        </button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
