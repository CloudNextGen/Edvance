<template>
    <div class="instruction-card">

        <!-- Unified Card Header -->
        <div class="card-header slds-p-horizontal_medium slds-p-vertical_small">
            <div class="header-inner">
                <lightning-icon icon-name="custom:custom19" size="small" class="header-icon"></lightning-icon>
                <span class="header-title">Guidelines &amp; Instructions</span>
            </div>
            <template if:true={roleName}>
                <span class="role-pill">{roleName}</span>
            </template>
        </div>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-p-around_large slds-align_absolute-center">
                <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Error State -->
        <template if:true={error}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small" variant="inverse"></lightning-icon>
                    <h2>{error}</h2>
                </div>
            </div>
        </template>

        <!-- Main Body -->
        <template if:false={isLoading}>
            <div class="instruction-container">
                <template if:true={hasAnyInstructions}>

                    <!-- Section 1: General (All) -->
                    <template if:true={hasGeneral}>
                        <div class="section-divider">
                            <span class="section-title">General Guidelines</span>
                        </div>
                        <div class="instruction-list">
                            <template for:each={generalList} for:item="item">
                                <div key={item.Id} class="instruction-row">
                                    <div class="content-container">
                                        <lightning-formatted-rich-text 
                                            value={item.Instructions__c} 
                                            class="instruction-rich-text">
                                        </lightning-formatted-rich-text>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Section 2: Role Specific -->
                    <template if:true={hasRole}>
                        <div class="section-divider slds-m-top_small">
                            <span class="section-title">{roleName} Directives</span>
                        </div>
                        <div class="instruction-list">
                            <template for:each={roleList} for:item="item">
                                <div key={item.Id} class="instruction-row role-row">
                                    <div class="content-container">
                                        <lightning-formatted-rich-text 
                                            value={item.Instructions__c} 
                                            class="instruction-rich-text">
                                        </lightning-formatted-rich-text>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                </template>

                <!-- Empty State -->
                <template if:false={hasAnyInstructions}>
                    <div class="slds-text-align_center slds-p-around_large">
                        <lightning-icon icon-name="utility:info_alt" size="medium" variant="neutral"></lightning-icon>
                        <p class="slds-m-top_small empty-text">No active instructions available at this time.</p>
                    </div>
                </template>
            </div>
        </template>

    </div>
</template>
