<template>
    <section class="deductions-section">
        <!-- SECTION HEADER -->
        <div class="section-header">
    <div class="header-left">
        <div class="header-badge">
            <svg class="badge-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M12 2L1 21h22L12 2zm1 16h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
            </svg>
            <span class="badge-text">Deductions Warning</span>
        </div>
        <div class="title-group">
            <h2 class="section-title">Outstanding Deductions</h2>
            <span class="count-pill">Top 3 Unsettled</span>
        </div>
    </div>
    
    <button 
        class="refresh-btn" 
        onclick={handleRefresh}
        disabled={isLoading}
        title="Refresh list">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36M20.49 15a9 9 0 0 1-14.85 3.36"/>
        </svg>
    </button>
</div>

        <!-- LOADING STATE -->
        <template if:true={isLoading}>
            <div class="loading-state" aria-live="polite">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </template>

        <!-- ERROR STATE -->
        <template if:true={hasError}>
            <div class="error-state">
                <div class="error-icon">⚠️</div>
                <p class="error-message">{errorMessage}</p>
                <button class="retry-btn" onclick={handleRefresh}>
                    Try Again
                </button>
            </div>
        </template>

        <!-- EMPTY STATE -->
        <template if:true={isEmpty}>
            <div class="empty-state">
                <div class="empty-icon">✨</div>
                <p class="empty-title">No Outstanding Deductions</p>
                <p class="empty-desc">All employees have settled their deductions. Great work!</p>
            </div>
        </template>

        <!-- DEDUCTIONS LIST -->
        <template if:true={hasResults}>
            <div class="deductions-container">
                <template for:each={topEmployees} for:item="employee">
                    <article key={employee.employeeId} class="deduction-card">
                        <!-- RANK BADGE -->
                        <div class="rank-badge" data-rank={employee.rank}>
                            #{employee.rank}
                        </div>

                        <!-- CARD HEADER -->
                        <div class="card-content">
                            <!-- EMPLOYEE INFO -->
                            <div class="employee-info">
                                <div class="employee-avatar">
                                    {employee.initials}
                                </div>
                                <div class="employee-details">
                                    <h3 class="employee-name">{employee.employeeName}</h3>
                                    <p class="attendance-date">{employee.dateFormatted}</p>
                                </div>
                            </div>

                            <!-- DEDUCTION AMOUNT -->
                            <div class="deduction-amount">
                                <span class="amount-label">Pending</span>
                                <span class="amount-value">{employee.deductionFormatted}</span>
                                <template if:true={employee.hasPaid}>
                                    <span class="paid-note">{employee.paidFormatted} paid of {employee.grossFormatted}</span>
                                </template>
                            </div>
                        </div>

                        <!-- CARD DETAILS: LATE DAYS -->
                        <div class="card-details">
                            <div class="detail-row">
                                <div class="detail-item">
                                    <span class="detail-label">OFFICE LATE</span>
                                    <span class="detail-value">{employee.officeLateDays} Days</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">LUNCH LATE</span>
                                    <span class="detail-value">{employee.lunchLateDays} Days</span>
                                </div>
                            </div>
                        </div>

                        <!-- ACTIONS (HR only) -->
                        <template if:true={isHr}>
                            <div class="card-actions">
                                <button type="button" class="action-btn action-btn-primary" data-id={employee.employeeId} onclick={handleRedeemClick}>Redeem</button>
                                <button type="button" class="action-btn action-btn-secondary" data-id={employee.employeeId} onclick={handleHistoryClick}>History</button>
                            </div>
                        </template>
                    </article>
                </template>
            </div>
        </template>

        <!-- MODAL -->
        <template if:true={showModal}>
            <div class="modal-backdrop" onclick={handleCloseModal}></div>
            <div class="modal" role="dialog" aria-modal="true">
                <div class="modal-header">
                    <h3 class="modal-title">{modalTitle}</h3>
                    <button type="button" class="modal-close" onclick={handleCloseModal} title="Close">&times;</button>
                </div>

                <div class="modal-body">
                    <template if:true={modalError}>
                        <div class="modal-error">{modalError}</div>
                    </template>

                    <!-- REDEEM -->
                    <template if:true={isRedeemModal}>
                        <div class="balance-box">
                            <div><span class="amount-label">Outstanding</span><div class="balance-value">{balanceFormatted}</div></div>
                            <div><span class="amount-label">Left after payment</span><div class="balance-value balance-after">{balanceAfterFormatted}</div></div>
                        </div>

                        <div class="field-row">
                            <lightning-input type="number" label="Amount paid (₹)" step="0.01" min="0.01"
                                value={amount} onchange={handleAmountChange}></lightning-input>
                            <button type="button" class="link-btn" onclick={handlePayFull}>Pay full</button>
                        </div>
                        <lightning-input type="date" label="Payment date" value={paymentDate} max={todayStr}
                            onchange={handleDateChange}></lightning-input>
                        <lightning-combobox label="Payment mode" value={paymentMode} options={modeOptions}
                            placeholder="Select (optional)" onchange={handleModeChange}></lightning-combobox>
                        <lightning-textarea label="Remarks" value={remarks} maxlength="255"
                            onchange={handleRemarksChange}></lightning-textarea>
                    </template>

                    <!-- HISTORY -->
                    <template if:true={isHistoryModal}>
                        <template if:true={isHistoryLoading}><p class="history-empty">Loading...</p></template>
                        <template if:true={noHistory}><p class="history-empty">No payments recorded this month.</p></template>
                        <template if:true={hasHistory}>
                            <template for:each={history} for:item="p">
                                <div key={p.id} class="history-row">
                                    <div class="history-top">
                                        <span class="history-amount">{p.amount}</span>
                                        <span class="history-date">{p.paymentDate}</span>
                                    </div>
                                    <div class="history-meta">{p.balanceBefore} → {p.balanceAfter} left · {p.paymentMode}</div>
                                    <div class="history-meta">Recorded {p.recordedAt} by {p.recordedBy}</div>
                                    <template if:true={p.remarks}><div class="history-meta">{p.remarks}</div></template>
                                </div>
                            </template>
                        </template>
                    </template>
                </div>

                <div class="modal-footer">
                    <button type="button" class="action-btn action-btn-secondary" onclick={handleCloseModal} disabled={isSaving}>Close</button>
                    <template if:true={isRedeemModal}>
                        <button type="button" class="action-btn action-btn-primary" onclick={handleConfirm} disabled={isSaving}>{saveLabel}</button>
                    </template>
                </div>
            </div>
        </template>
    </section>
</template>
