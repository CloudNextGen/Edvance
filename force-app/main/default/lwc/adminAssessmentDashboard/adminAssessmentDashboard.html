<template>
    <div class="admin-dashboard">

        <!-- ═══════════════════ LOADING ═══════════════════ -->
        <template if:true={isLoading}>
            <div class="loading-panel">
                <div class="loading-mark"></div>
                <p>Loading…</p>
            </div>
        </template>

        <!-- ═══════════════════ USER SCREEN ═══════════════════ -->
        <template if:true={showUserScreen}>
            <div class="screen">    
                <div class="screen-header screen-header-with-action">
                    <div class="screen-header-text">
                        <h1 class="screen-title">Experience Portal User</h1>
                        <p class="screen-subtitle">{dashboardSubtitle}</p>
                    </div>
                    <div class="dashboard-header-actions">
                        <template if:true={showManagePortalUsersButton}>
                            <button type="button" class="btn-view-appeals" onclick={handleOpenUserStatusModal}>
                                Activate / Deactivate
                            </button>
                        </template>
                        <template if:true={showCreateUserLink}>
                            <button type="button" class="btn-view-appeals" onclick={handleOpenAppeals}>
                                View Appeals
                            </button>
                        </template>
                        <template if:true={showCreateUserLink}>
                            <button type="button" class="btn-create-user" onclick={handleOpenCreateUser}>
                                + Create User
                            </button>
                        </template>
                    </div>
                </div>
        
                <!-- SEARCH BAR -->
                <template if:false={isModalOpen}>
                    <div class="user-search-bar">
                        <lightning-icon icon-name="utility:search" size="x-small" class="user-search-icon"></lightning-icon>
                        <input
                            type="search"
                            class="user-search-input"
                            placeholder="Search by name or email…"
                            value={searchTerm}
                            autocomplete="off"
                            oninput={handleSearchChange} />
                        <template if:true={searchTerm}>
                            <button class="user-search-clear" onclick={handleClearSearch} type="button">
                                <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                            </button>
                        </template>
                    </div>
                </template>
        
                <template if:true={hasNoSearchResults}>
                    <div class="user-search-empty">
                        <p>No users match "<strong>{searchTerm}</strong>"</p>
                    </div>
                </template>
        
                <!-- DYNAMIC FULLY RESPONSIVE ROSTER TABLE -->
                <div class="users-table-container">
                    <table class="users-roster-table">
                        <thead>
                            <tr>
                                <th class="col-name">
                                    <span class="th-content">
                                        <lightning-icon icon-name="utility:user" size="xx-small" class="th-icon"></lightning-icon>
                                        Member
                                    </span>
                                </th>
                                <th class="col-contact">
                                    <span class="th-content">
                                        <lightning-icon icon-name="utility:email" size="xx-small" class="th-icon"></lightning-icon>
                                        Contact Information
                                    </span>
                                </th>
                                <th class="col-company">
                                    <span class="th-content">
                                        <lightning-icon icon-name="utility:company" size="xx-small" class="th-icon"></lightning-icon>
                                        Account / Department
                                    </span>
                                </th>
                                <th class="col-actions">
                                    <span class="th-content">
                                        <lightning-icon icon-name="utility:settings" size="xx-small" class="th-icon"></lightning-icon>
                                        Actions
                                    </span>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredUsers} for:item="u">
                                <tr key={u.Id} class="user-table-row">
                                    <!-- Member Profile -->
                                    <td class="col-name" data-label="Member">
                                        <div class="user-identity-cell">
                                            <div class="table-inline-avatar">
                                                <lightning-icon icon-name="standard:avatar" size="small"></lightning-icon>
                                            </div>
                                            <div class="user-name-box">
                                                <span class="user-primary-name">{u.Name}</span>
                                                <template if:true={u.Title}>
                                                    <span class="user-subtitle">{u.Title}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </td>

                                    <!-- Contact Details -->
                                    <td class="col-contact" data-label="Contact">
                                        <div class="contact-pill-box">
                                            <template if:true={u.hasEmail}>
                                                <div class="contact-meta-item">
                                                    <lightning-icon icon-name="utility:email" size="xx-small" class="meta-icon"></lightning-icon>
                                                    <span class="meta-text">{u.EmailDisplay}</span>
                                                </div>
                                            </template>

                                            <template if:true={u.hasPhone}>
                                                <div class="contact-meta-item">
                                                    <lightning-icon icon-name="utility:call" size="xx-small" class="meta-icon"></lightning-icon>
                                                    <span class="meta-text">{u.PhoneDisplay}</span>
                                                </div>
                                            </template>

                                            <template if:false={u.hasEmail}>
                                                <template if:false={u.hasPhone}>
                                                    <span class="no-contact-text">—</span>
                                                </template>
                                            </template>
                                        </div>
                                    </td>

                                    <!-- Account / Department Badge -->
                                    <td class="col-company" data-label="Account">
                                        <div class="company-badge-wrapper">
                                            <span class="company-badge">
                                                <lightning-icon icon-name="utility:company" size="xx-small" class="badge-icon"></lightning-icon>
                                                <span class="company-name">{u.AccountName}</span>
                                            </span>
                                        </div>
                                    </td>

                                    <!-- Administrative Actions -->
                                    <td class="col-actions" data-label="Actions">
                                        <div class="actions-cell-wrapper">
                                            <div class="action-btn-group">
                                                <template if:true={showAttendanceLink}>    
                                                    <button type="button"
                                                        class="admin-action-btn btn-tone-edit"
                                                        data-id={u.Id}
                                                        data-name={u.Name}
                                                        onclick={handleOpenEditUser}
                                                        title="Edit Contact">
                                                        <lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>
                                                        <span>Edit</span>
                                                    </button>
                                                </template>

                                                <template if:true={showAttendanceLink}>
                                                    <button type="button"
                                                        class="admin-action-btn btn-tone-attendance"
                                                        data-contact-id={u.Id}
                                                        data-name={u.Name}
                                                        onclick={handleOpenAttendance}
                                                        title="View Attendance">
                                                        <lightning-icon icon-name="utility:event" size="xx-small"></lightning-icon>
                                                        <span>Attendance</span>
                                                    </button>
                                                </template>

                                                <template if:true={showAssignFilesLink}>
                                                    <button type="button"
                                                        class="admin-action-btn btn-tone-files"
                                                        data-contact-id={u.Id}
                                                        data-name={u.Name}
                                                        onclick={handleOpenAssign}
                                                        title="Assign or revoke Learning Files">
                                                        <lightning-icon icon-name="utility:file" size="xx-small"></lightning-icon>
                                                        <span>Files</span>
                                                    </button>
                                                </template>

                                                <template if:true={showAssignFilesLink}>
                                                    <button type="button"
                                                        class="admin-action-btn btn-tone-tests"
                                                        data-contact-id={u.Id}
                                                        data-name={u.Name}
                                                        onclick={handleOpenAssignAssignments}
                                                        title="Assign Tests">
                                                        <lightning-icon icon-name="utility:note" size="xx-small"></lightning-icon>
                                                        <span>Assignment</span>
                                                    </button>
                                                </template>

                                                <template if:true={showAssignmentsLink}>
                                                    <button type="button"
                                                        class="admin-action-btn btn-tone-assignments"
                                                        data-id={u.Id}
                                                        data-name={u.Name}
                                                        onclick={handleUserClick}
                                                        title="View Results">
                                                        <lightning-icon icon-name="utility:list" size="xx-small"></lightning-icon>
                                                        <span>Result</span>
                                                    </button>
                                                </template>

                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>

                <!-- EDIT CONTACT MODAL -->
                <template if:true={showEditUserModal}>
                    <div class="ccu-modal-overlay">
                        <div class="ccu-modal-panel edit-user-panel">
                            <button class="ccu-modal-close" onclick={handleCloseEditUser} title="Close">
                                <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                            </button>
                            
                            <h2 class="edit-modal-title">Edit Contact Details</h2>
                            <p class="edit-modal-subtitle">{selectedUserName}</p>

                            <lightning-record-edit-form
                                record-id={selectedContactId}
                                object-api-name="Contact"
                                onsuccess={handleEditSuccess}
                                onerror={handleEditError}>
                                
                                <lightning-messages></lightning-messages>

                                <div class="slds-grid slds-wrap slds-gutters edit-form-fields">
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="FirstName"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="LastName"></lightning-input-field>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="Email"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="Phone"></lightning-input-field>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="AccountId"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="Manager__c"></lightning-input-field>
                                    </div>

                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="HR__c"></lightning-input-field>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                        <lightning-input-field field-name="Mentor__c"></lightning-input-field>
                                    </div>
                                </div>

                                <div class="edit-form-footer">
                                    <lightning-button label="Cancel" onclick={handleCloseEditUser} class="slds-m-right_small"></lightning-button>
                                    <lightning-button variant="brand" type="submit" label="Save Changes"></lightning-button>
                                </div>
                            </lightning-record-edit-form>
                        </div>
                    </div>
                </template>

                <!-- ASSIGN FILES MODAL -->
                <template if:true={showAssignModal}>
                    <c-assign-learning-files-modal
                        contact-id={selectedContactId}
                        user-name={selectedUserName}
                        onclose={handleCloseAssign}>
                    </c-assign-learning-files-modal>
                </template>

                <!-- ASSIGN ASSIGNMENTS MODAL -->
                <template if:true={showAssignAssignmentsModal}>
                    <c-assign-assignments-modal
                        contact-id={selectedContactId}
                        user-name={selectedUserName}
                        onclose={handleCloseAssignAssignments}>
                    </c-assign-assignments-modal>
                </template>

                <!-- CREATE USER MODAL -->
                <template if:true={showCreateUserModal}>
                    <div class="ccu-modal-overlay">
                        <div class="ccu-modal-panel create-user-panel">
                            <button class="ccu-modal-close" onclick={handleCloseCreateUser} title="Close">
                                <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                            </button>
                            <c-creating-community-user onusercreated={handleCreateUserSuccess}></c-creating-community-user>
                        </div>
                    </div>
                </template>

                <!-- ACTIVATE / DEACTIVATE PORTAL USER MODAL -->
                <template if:true={showUserStatusModal}>
                    <div class="ccu-modal-overlay">
                        <section class="ccu-modal-panel user-status-panel" role="dialog" aria-modal="true" aria-labelledby="user-status-title">
                            <button class="ccu-modal-close" onclick={handleCloseUserStatusModal} title="Close">
                                <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                            </button>
                            <span class="eyebrow">User Management</span>
                            <h2 id="user-status-title" class="edit-modal-title">Activate / Deactivate Users</h2>
                            <p class="edit-modal-subtitle">Choose which users to manage.</p>

                            <template if:false={userStatusMode}>
                                <div class="user-status-mode-options">
                                    <button type="button" class="user-status-mode-card" onclick={handleSelectActivateMode}>
                                        <lightning-icon icon-name="utility:unlock" size="small"></lightning-icon>
                                        <span>Activate old user</span>
                                        <small>Find a deactivated portal user and restore access.</small>
                                    </button>
                                    <button type="button" class="user-status-mode-card" onclick={handleSelectDeactivateMode}>
                                        <lightning-icon icon-name="utility:lock" size="small"></lightning-icon>
                                        <span>Deactivate current user</span>
                                        <small>Find an active portal user and remove access.</small>
                                    </button>
                                </div>
                            </template>

                            <template if:true={userStatusMode}>
                                <button type="button" class="user-status-back" onclick={handleBackToUserStatusActions}>
                                    <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                                    Change action
                                </button>
                                <h3 class="user-status-list-title">{userStatusTitle}</h3>
                                <div class="user-status-search">
                                    <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                                    <input
                                        type="search"
                                        placeholder={userStatusSearchPlaceholder}
                                        value={userStatusSearch}
                                        oninput={handleUserStatusSearch}
                                        autocomplete="off" />
                                </div>
                                <p class="user-status-count">{userStatusCountLabel}</p>

                                <div class="user-status-list" onscroll={handleUserStatusListScroll}>
                                    <template if:true={hasUserStatusRows}>
                                        <template for:each={userStatusRows} for:item="user">
                                            <div class="user-status-row" key={user.id}>
                                                <div class="user-status-identity">
                                                    <strong>{user.name}</strong>
                                                    <span>{user.email}</span>
                                                    <template if:true={user.accountName}>
                                                        <small>{user.accountName}</small>
                                                    </template>
                                                </div>
                                                <button
                                                    type="button"
                                                    class={user.actionClass}
                                                    data-user-id={user.id}
                                                    data-user-name={user.name}
                                                    onclick={handleChooseUserStatusChange}
                                                    disabled={isUserStatusActionPending}>
                                                    {userStatusActionLabel}
                                                </button>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={showUserStatusEmpty}>
                                        <p class="user-status-empty">No matching users found.</p>
                                    </template>
                                    <template if:true={hasUserStatusError}>
                                        <div class="user-status-error">
                                            <span>{userStatusError}</span>
                                            <button type="button" onclick={loadUserStatusRows}>Try again</button>
                                        </div>
                                    </template>
                                    <template if:true={showUserStatusSpinner}>
                                        <div class="user-status-spinner">
                                            <lightning-spinner alternative-text="Loading users" size="small"></lightning-spinner>
                                        </div>
                                    </template>
                                </div>

                            </template>
                        </section>
                    </div>
                </template>
            </div>
        </template>

        <!-- ATTENDANCE SCREEN -->
        <template if:true={showAttendanceScreen}>
            <c-attendance-admin-detail
                contact-id={selectedContactId}
                employee-name={selectedUserName}
                onback={handleBackFromAttendance}>
            </c-attendance-admin-detail>
        </template>

        <!-- APPEALS SCREEN -->
        <template if:true={showAppealsScreen}>
            <div class="screen appeals-screen">
                <button class="back-link" onclick={handleBackFromAppeals}>
                    <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                    <span>All Users</span>
                </button>
                <div class="screen-header screen-header-with-action">
                    <div class="screen-header-text">
                        <span class="eyebrow">Admin Console</span>
                        <h1 class="screen-title">Pending Attendance Appeals</h1>
                        <p class="screen-subtitle">Select a team member's name to review their appeal details.</p>
                    </div>
                    <div class="dashboard-header-actions">
                        <template if:true={showAppealDetail}>
                            <lightning-button-group>
                            <lightning-button
                                label="Approve"
                                title="Approve this appeal"
                                onclick={handleApproveSelected}
                                disabled={disableAppealDetailReviewActions}>
                            </lightning-button>
                            <lightning-button
                                label="Reject"
                                title="Reject this appeal"
                                onclick={handleRejectSelected}
                                disabled={disableAppealDetailReviewActions}>
                            </lightning-button>
                            <lightning-button
                                label="Refresh"
                                title="Refresh pending appeals"
                                icon-name="utility:refresh"
                                onclick={handleRefreshAppeals}
                                disabled={isRefreshingAppeals}>
                            </lightning-button>
                            </lightning-button-group>
                        </template>
                        <template if:false={showAppealDetail}>
                            <lightning-button
                                label="Refresh"
                                title="Refresh pending appeals"
                                icon-name="utility:refresh"
                                onclick={handleRefreshAppeals}
                                disabled={isRefreshingAppeals}>
                            </lightning-button>
                        </template>
                    </div>
                </div>

                <template if:true={isAppealsLoading}>
                    <div class="loading-panel">
                        <lightning-spinner alternative-text="Loading pending appeals" size="medium"></lightning-spinner>
                    </div>
                </template>
                <template if:false={isAppealsLoading}>
                    <template if:true={showAppealDetail}>
                        <section class="appeal-inline-detail" aria-labelledby="appeal-detail-title">
                            <button type="button" class="back-link" onclick={handleCloseAppealDetail}>
                                <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                                <span>Back to appeals</span>
                            </button>
                            <span class="eyebrow">Attendance Appeal</span>
                            <h2 id="appeal-detail-title" class="appeal-modal-title">{selectedAppeal.EmployeeName}</h2>
                            <dl class="appeal-detail-list">
                                <div><dt>Attendance event</dt><dd>{selectedAppeal.Type__c}</dd></div>
                                <div><dt>Date</dt><dd>{selectedAppeal.AppealDate}</dd></div>
                                <div><dt>Late by</dt><dd>{selectedAppeal.Late_Minutes__c} minutes</dd></div>
                                <div><dt>Current deduction</dt><dd>₹{selectedAppeal.Deduction_Amount__c}</dd></div>
                                <div><dt>Appeal reason</dt><dd>{selectedAppeal.AppealReason}</dd></div>
                            </dl>
                        </section>
                    </template>
                    <template if:false={showAppealDetail}>
                        <template if:true={hasNoPendingAppeals}>
                            <div class="appeals-empty-state">There are no pending appeals.</div>
                        </template>
                        <template if:false={hasNoPendingAppeals}>
                            <div class="appeal-review-toolbar">
                                <p class="appeal-selection-count">{selectedAppealCount} selected</p>
                                <div class="appeal-selection-actions">
                                    <button type="button" class="btn-approve-all" onclick={handleApproveSelected} disabled={disableSelectedReviewActions}>
                                        Approve
                                    </button>
                                    <button type="button" class="btn-reject-selected" onclick={handleRejectSelected} disabled={disableSelectedReviewActions}>
                                        Reject
                                    </button>
                                </div>
                            </div>
                            <div class="appeals-table-wrap">
                                <table class="appeals-table">
                                    <thead>
                                        <tr>
                                            <th class="appeal-checkbox-column" aria-label="Select appeal"></th>
                                            <th>Team Member</th>
                                            <th>Attendance Event</th>
                                            <th>Date</th>
                                            <th>Late (minutes)</th>
                                            <th>Current Deduction</th>
                                            <th>Appeal Reason</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={pendingAppeals} for:item="appeal">
                                            <tr key={appeal.Id}>
                                                <td class="appeal-checkbox-column">
                                                    <input type="checkbox" data-id={appeal.Id} checked={appeal.isSelected} aria-label="Select appeal" onchange={handleAppealSelection} />
                                                </td>
                                                <td>
                                                    <button type="button" class="appeal-user-link" data-id={appeal.Id} onclick={handleViewAppeal}>
                                                        {appeal.EmployeeName}
                                                    </button>
                                                </td>
                                                <td>{appeal.Type__c}</td>
                                                <td>{appeal.AppealDate}</td>
                                                <td>{appeal.Late_Minutes__c}</td>
                                                <td>{appeal.CurrentDeductionLabel}</td>
                                                <td class="appeal-reason-cell" title={appeal.AppealReason}>{appeal.AppealReason}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </template>
                </template>
            </div>
        </template>

        <!-- CATEGORY SCREEN -->
        <template if:true={showCategoryScreen}>
            <div class="screen">
                <button class="back-link" onclick={navigateBackToUsers}>
                    <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                    <span>All Users</span>
                </button>

                <div class="screen-header">
                    <span class="eyebrow">Student: {selectedUserName}</span>
                    <h1 class="screen-title">Pick a topic</h1>
                    <p class="screen-subtitle">Choose a category to inspect assignment status.</p>
                </div>

                <div class="category-grid">
                    <template for:each={categories} for:item="cat">
                        <div key={cat.Id}
                             class="category-card"
                             data-id={cat.Id}
                             data-name={cat.Name}
                             onclick={handleCategoryClick}>
                            <div class="category-card-mark">
                                <lightning-icon icon-name="standard:folder" size="small"></lightning-icon>
                            </div>
                            <p class="category-card-name">{cat.Name}</p>
                            <span class="category-card-go">Open →</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ASSIGNMENT SCREEN -->
        <template if:true={showAssignmentScreen}>
            <div class="screen">
                <button class="back-link" onclick={navigateBackToCategories}>
                    <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                    <span>All categories</span>
                </button>

                <div class="screen-header">
                    <span class="eyebrow">{selectedCategoryName} · {selectedUserName}</span>
                    <h1 class="screen-title">What's next</h1>
                </div>

                <div class="assignment-list">
                    <template for:each={assignments} for:item="assignment">
                        <div key={assignment.Id} class={assignment.rowClass}>
                            <div class="assignment-row-info">
                                <p class="assignment-row-name">{assignment.Name}</p>
                                <p class="assignment-row-meta">
                                    <lightning-icon icon-name="utility:rows" size="xx-small"></lightning-icon>
                                    <span>{assignment.Total_Question_Count__c} questions</span>
                                </p>
                            </div>

                            <template if:true={assignment.isEligibleStatus}>
                                <button class="btn-start" disabled>Eligible</button>
                            </template>
                            <template if:true={assignment.isCompletedStatus}>
                                <button class="btn-start btn-completed"
                                        data-id={assignment.Id}
                                        data-title={assignment.Name}
                                        onclick={handleViewAttempts}>
                                    View attempts →
                                </button>
                            </template>
                            <template if:true={assignment.isLockedStatus}>
                                <button class="btn-start" disabled>Locked</button>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ATTEMPTS SCREEN -->
        <template if:true={showAttemptsScreen}>
            <div class="screen">
                <button class="back-link" onclick={navigateBackToAssignments}>
                    <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                    <span>Back</span>
                </button>

                <div class="screen-header">
                    <span class="eyebrow">{selectedCategoryName} · {selectedUserName}</span>
                    <h1 class="screen-title">{selectedAssignmentTitle}</h1>
                    <p class="screen-subtitle">Select an attempt to review answers and scores.</p>
                </div>

                <div class="assignment-list">
                    <template for:each={attempts} for:item="att">
                        <div key={att.Id}
                             class="assignment-row attempt-row"
                             data-id={att.Id}
                             data-attempt={att.Attempt_Number__c}
                             onclick={handleAttemptClick}>
                            <div class="assignment-row-info">
                                <p class="assignment-row-name">Attempt {att.Attempt_Number__c}</p>
                                <p class="assignment-row-meta">
                                    <lightning-icon icon-name="utility:date_time" size="xx-small"></lightning-icon>
                                    <lightning-formatted-date-time
                                        value={att.CreatedDate}
                                        year="numeric"
                                        month="short"
                                        day="numeric"
                                        hour="2-digit"
                                        minute="2-digit">
                                    </lightning-formatted-date-time>
                                </p>
                            </div>
                            <template if:true={att.Is_Locked__c}>
                                <span class="locked-chip"
                                      title={att.Lock_Reason__c}>
                                    <lightning-icon
                                        icon-name="utility:lock"
                                        size="xx-small">
                                    </lightning-icon>
                                    Locked
                                </span>
                            </template>
                            <span class="attempt-score">{att.Pass_Fail_Status__c}</span>
                            <span class="attempt-score">{att.Earned_Score__c} / {att.Max_Score__c}</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- REVIEW SCREEN -->
        <template if:true={showReviewScreen}>
            <div class="screen">
                <button class="back-link" onclick={navigateBackToAttempts}>
                    <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                    <span>All attempts</span>
                </button>

                <div class="screen-header">
                    <span class="eyebrow">{selectedAssignmentTitle} · {selectedUserName}</span>
                    <h1 class="screen-title">Attempt {selectedAttemptNumber} — Review</h1>
                </div>

                <div class="question-stack">
                    <template for:each={attemptDetail} for:item="q">
                        <div key={q.Id} class="question-card">
                            <div class="question-card-head">
                                <span class="question-number">Question {q.displayIndex}</span>
                                <span class="review-score">{q.AI_Grade__c} / {q.Max_Points__c} pts</span>
                            </div>
                            <p class="q-text">{q.Question_Text__c}</p>
                            <div class="review-label">answer</div>
                            <div class="review-answer">{q.User_Answer__c}</div>
                            <template if:true={q.AI_Feedback__c}>
                                <div class="review-label review-label-feedback">AI Feedback</div>
                                <div class="review-feedback">{q.AI_Feedback__c}</div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

    </div>
</template>
